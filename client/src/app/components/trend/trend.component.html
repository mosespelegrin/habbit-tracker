<div class="panel">
  <h2>Completion Trend</h2>
  <p class="panel-subtitle">Weekly completion rate across all your habits, last {{ weeks.length || 12 }} weeks.</p>

  <p class="loading-state" *ngIf="isLoading" role="status" aria-live="polite">Loading your trend...</p>
  <p class="error" *ngIf="error" role="alert">{{ error }}</p>

  <ng-container *ngIf="!isLoading && weeks.length">
    <p class="sr-only">{{ summary }}</p>

    <svg
      class="trend-chart"
      [attr.viewBox]="'0 0 ' + (chartWidth + axisWidth) + ' ' + (chartHeight + 30)"
      [attr.width]="chartWidth + axisWidth"
      [attr.height]="chartHeight + 30"
      role="img"
      [attr.aria-label]="summary"
    >
      <g *ngFor="let tick of axisTicks">
        <line
          class="trend-grid"
          [attr.x1]="axisWidth"
          [attr.x2]="chartWidth + axisWidth"
          [attr.y1]="chartHeight - tickY(tick)"
          [attr.y2]="chartHeight - tickY(tick)"
        ></line>
        <text
          class="trend-axis"
          [attr.x]="axisWidth - 6"
          [attr.y]="chartHeight - tickY(tick) + 4"
          text-anchor="end"
        >{{ tick }}%</text>
      </g>

      <g *ngFor="let week of weeks; let i = index" [attr.transform]="'translate(' + axisWidth + ',0)'">
        <title>{{ week.weekStart }}: {{ week.completionRate }}% complete</title>
        <rect
          class="trend-bar"
          [attr.x]="i * (barWidth + barGap)"
          [attr.y]="chartHeight - barHeight(week.completionRate)"
          [attr.width]="barWidth"
          [attr.height]="barHeight(week.completionRate)"
          rx="4"
        ></rect>
        <text
          class="trend-label"
          [attr.x]="i * (barWidth + barGap) + barWidth / 2"
          [attr.y]="chartHeight + 18"
          text-anchor="middle"
        >{{ shortLabel(week.weekStart) }}</text>
      </g>
    </svg>

    <p class="trend-summary">{{ summary }}</p>
  </ng-container>

  <p *ngIf="!isLoading && !weeks.length" class="empty">No completion data yet - check in on a habit to start your trend.</p>
</div>
