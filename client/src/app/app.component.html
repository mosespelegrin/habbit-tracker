<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <circle cx="12" cy="12" r="7" stroke-dasharray="2 3"></circle>
        <circle cx="12" cy="12" r="10.5" stroke-dasharray="1 4"></circle>
      </svg>
      <div>
        <h1>Atomic</h1>
        <p class="tagline">Small habits. Remarkable results.</p>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main" *ngIf="authService.isAuthenticated()">
      <a routerLink="/habits" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="5"></circle>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
        </svg>
        <span class="nav-label">Habits</span>
      </a>
      <a routerLink="/scorecard" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 6h10M10 12h10M10 18h10"></path>
          <path d="M4 6l1.6 1.6L8.4 4.8M4 12l1.6 1.6 2.8-2.8M4 18l1.6 1.6 2.8-2.8"></path>
        </svg>
        <span class="nav-label">Scorecard</span>
      </a>
      <a routerLink="/weekly-review" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3"></rect>
          <path d="M8 3v4M16 3v4M3 10h18"></path>
        </svg>
        <span class="nav-label">Review</span>
      </a>
      <a routerLink="/trends" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 21h18"></path>
          <path d="M6 21v-6M11 21V8M16 21v-9M21 21V5"></path>
        </svg>
        <span class="nav-label">Trends</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16M4 17h16"></path>
          <circle cx="9" cy="7" r="2.4"></circle>
          <circle cx="16" cy="17" r="2.4"></circle>
        </svg>
        <span class="nav-label">Settings</span>
      </a>
    </nav>

    <button class="theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="darkMode ? 'Switch to light mode' : 'Switch to dark mode'">
      <svg *ngIf="darkMode" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg *ngIf="!darkMode" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"></path>
      </svg>
      <span>{{ darkMode ? 'Light' : 'Dark' }}</span>
    </button>
  </header>

  <p class="quote">"{{ quote }}"<span class="quote-attr"> — James Clear, Atomic Habits</span></p>

  <main id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
