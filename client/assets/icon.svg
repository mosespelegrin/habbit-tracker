<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Atomic habit tracker">
  <!--
    Atomic app icon - "atom over morning haze".
    Concept: three atom orbits (Atomic Habits / identity), the nucleus is a done-check
    (every check-in is a vote), sunrise glow + glass sheen echo the app's UI theme.
    Rendered to icon.png (512x512) by assets/render-icon.js; regenerate with:
      node assets/render-icon.js && npm run assets:android
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2532"/>
      <stop offset="0.5" stop-color="#0f4557"/>
      <stop offset="1" stop-color="#0e7f96"/>
    </linearGradient>
    <radialGradient id="sunrise" cx="0.78" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#f2a65a" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fd3e3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5fd3e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eafcff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5fd3e3" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- morning-haze sky -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sunrise)"/>

  <!-- glass sheen -->
  <path d="M0 116 A116 116 0 0 1 116 0 H396 A116 116 0 0 1 512 116 V196
           C374 252 138 252 0 196 Z" fill="url(#sheen)"/>

  <!-- glints -->
  <path d="M96 96 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 Z" fill="#ffffff" opacity="0.65"/>
  <path d="M430 120 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 Z" fill="#f2a65a" opacity="0.8"/>

  <!-- halo behind the nucleus -->
  <circle cx="256" cy="256" r="120" fill="url(#halo)"/>

  <!-- atom: three orbits -->
  <g transform="translate(256 256)" fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round">
    <ellipse rx="152" ry="63"/>
    <ellipse rx="152" ry="63" transform="rotate(60)"/>
    <ellipse rx="152" ry="63" transform="rotate(120)"/>
  </g>

  <!-- electrons -->
  <circle cx="408" cy="256" r="15" fill="#eafcff"/>
  <circle cx="332" cy="388" r="15" fill="#f2a65a"/>
  <circle cx="180" cy="388" r="15" fill="#eafcff"/>

  <!-- nucleus = the done-check -->
  <circle cx="256" cy="256" r="76" fill="#0e7486"/>
  <circle cx="256" cy="256" r="76" fill="none" stroke="#5fd3e3" stroke-width="7"/>
  <path d="M222 259 l23 25 45 -55" fill="none" stroke="#ffffff" stroke-width="19"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
